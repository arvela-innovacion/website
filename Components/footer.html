<style>
  .arvela-footer{
    border-top:1px solid #e5e9f2;
    background:#fff;
    padding:22px 0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .arvela-footer__inner{
    width:min(calc(100% - 32px),1180px);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .arvela-footer__name{
    color:#172033;
    font-size:.9rem;
    font-weight:700;
    letter-spacing:.02em;
  }
  .arvela-footer__social{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .arvela-footer__social a{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:9px;
    color:#5f6b85;
    border:1px solid #e5e9f2;
    text-decoration:none;
    transition:color .15s ease,border-color .15s ease,transform .15s ease;
  }
  .arvela-footer__social a:hover{
    color:#172033;
    border-color:#cbd3df;
    transform:translateY(-1px);
  }
  .arvela-footer__social svg{
    width:17px;
    height:17px;
    fill:currentColor;
  }
  @media(max-width:560px){
    .arvela-footer__inner{
      flex-direction:column;
      justify-content:center;
      text-align:center;
      gap:13px;
    }
  }
</style>
